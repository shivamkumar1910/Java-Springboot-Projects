spring.application.name=wallet

server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

jwt.secret=${JWT_SECRET:paypal-clone-jwt-secret-2026-strong-key-12345}
jwt.expiration=86400000

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
